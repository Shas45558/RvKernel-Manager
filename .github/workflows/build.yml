name: Build RvKernel Manager

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Create temporary release keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass android \
            -keypass android \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=RvKernel Manager, OU=Android, O=RvKernel, L=Unknown, ST=Unknown, C=US"

          test -f "$RUNNER_TEMP/release.keystore"
          echo "Keystore created successfully."

      - name: Build release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.keystore
          RELEASE_STORE_PASSWORD: android
          RELEASE_KEY_ALIAS: release
          RELEASE_KEY_PASSWORD: android
        run: |
          ./gradlew clean
          ./gradlew assembleRelease --stacktrace

      - name: Find APK
        run: |
          echo "Built APKs:"
          find app/build/outputs/apk/release -type f -name "*.apk" -print

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: RvKernel-Manager-MTK-GPU-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
